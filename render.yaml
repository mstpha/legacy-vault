services:
  - type: web
    name: legacy-vault-backend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd legacy-vault-backend && npm ci --include=dev && npx prisma generate
    startCommand: cd legacy-vault-backend && node src/server.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_ROLE
        value: primary
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: legacy-vault-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

  - type: web
    name: legacy-vault-backend-backup
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd legacy-vault-backend-backup && npm ci --include=dev && npx prisma generate
    startCommand: cd legacy-vault-backend-backup && node scripts/prepare-render.js && node src/server.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_ROLE
        value: backup
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: B_DATABASE_URL
        sync: false
      - key: B_DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: B_SUPABASE_URL
        sync: false
      - key: B_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: legacy-vault-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

  - type: keyvalue
    name: legacy-vault-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
